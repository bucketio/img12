<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="840" viewBox="0 0 1600 840">
  <style>text { font-family: 'PingFang SC', 'Hiragino Sans GB', 'STHeiti', 'Helvetica Neue', sans-serif; }</style>
  <rect width="1600" height="840" fill="#FFFFFF"/>

  <text x="64" y="76" font-size="34" font-weight="800" fill="#0F172A">四大结构金属的综合顶刊“打法画像”对比（6 周 25 篇）</text>
  <text x="64" y="114" font-size="18" fill="#475569">不同金属体系形成了截然不同的顶刊突围路径：高熵多线跨界、铝高度分化、钢偏磁与循环、钛靠硬核破界</text>
  <line x1="64" y1="138" x2="1536" y2="138" stroke="#E2E8F0" stroke-width="2"/>

  <!-- Legend top -->
  <rect x="64" y="158" width="18" height="18" rx="4" fill="#1D4E89"/><text x="90" y="173" font-size="16" font-weight="600" fill="#334155">路径一·硬核破界</text>
  <rect x="246" y="158" width="18" height="18" rx="4" fill="#7B61FF"/><text x="272" y="173" font-size="16" font-weight="600" fill="#334155">路径二·结构+磁场</text>
  <rect x="440" y="158" width="18" height="18" rx="4" fill="#2A9D8F"/><text x="466" y="173" font-size="16" font-weight="600" fill="#334155">路径三·绿色循环/能源</text>
  <rect x="662" y="158" width="18" height="18" rx="4" fill="#F4A261"/><text x="688" y="173" font-size="16" font-weight="600" fill="#334155">路径四·高熵催化/生物</text>
  <rect x="886" y="158" width="18" height="18" rx="4" fill="#64748B"/><text x="912" y="173" font-size="16" font-weight="600" fill="#334155">路径五·电池/光电中的铝</text>

  <rect x="64" y="199" width="1472" height="114" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.2"/><text x="92" y="249" font-size="22" font-weight="800" fill="#0F172A">高熵/多主元</text><text x="92" y="279" font-size="17" font-weight="700" fill="#2563EB">共 12 篇 (48%)</text><rect x="230" y="229" width="152" height="50" rx="7" fill="#1D4E89"/><text x="306.0" y="260" text-anchor="middle" font-size="15" font-weight="700" fill="#FFFFFF">破界 3</text><rect x="386" y="229" width="152" height="50" rx="7" fill="#7B61FF"/><text x="462.0" y="260" text-anchor="middle" font-size="15" font-weight="700" fill="#FFFFFF">磁场 3</text><rect x="542" y="229" width="48" height="50" rx="7" fill="#2A9D8F"/><text x="566.0" y="260" text-anchor="middle" font-size="15" font-weight="700" fill="#FFFFFF">1</text><rect x="594" y="229" width="256" height="50" rx="7" fill="#F4A261"/><text x="722.0" y="260" text-anchor="middle" font-size="15" font-weight="700" fill="#FFFFFF">催化/生物 5</text><text x="895" y="247" font-size="18" font-weight="700" fill="#0F172A">占近半壁江山（48%），多路径全面开花</text><text x="895" y="279" font-size="15.5" fill="#475569">代表：宽温区打印胞网(NM)、高APB能软磁(AM)、>1300 h 非晶析氢(AM)</text><rect x="64" y="335" width="1472" height="114" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.2"/><text x="92" y="385" font-size="22" font-weight="800" fill="#0F172A">铝合金</text><text x="92" y="415" font-size="17" font-weight="700" fill="#2563EB">共 6 篇 (24%)</text><rect x="230" y="365" width="48" height="50" rx="7" fill="#1D4E89"/><text x="254.0" y="396" text-anchor="middle" font-size="15" font-weight="700" fill="#FFFFFF">1</text><rect x="282" y="365" width="48" height="50" rx="7" fill="#2A9D8F"/><text x="306.0" y="396" text-anchor="middle" font-size="15" font-weight="700" fill="#FFFFFF">1</text><rect x="334" y="365" width="204" height="50" rx="7" fill="#64748B"/><text x="436.0" y="396" text-anchor="middle" font-size="15" font-weight="700" fill="#FFFFFF">电池/光电 4</text><text x="895" y="383" font-size="18" font-weight="700" fill="#0F172A">期刊定位高度分化：NC 做硬核结构，AM/AFM 做电池光电</text><text x="895" y="415" font-size="15.5" fill="#475569">代表：绿光增材 AA7075(NC)、金属燃料网络(NC)、铝热失控隔离(AM)</text><rect x="64" y="471" width="1472" height="114" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.2"/><text x="92" y="521" font-size="22" font-weight="800" fill="#0F172A">钢铁</text><text x="92" y="551" font-size="17" font-weight="700" fill="#2563EB">共 4 篇 (16%)</text><rect x="230" y="501" width="100" height="50" rx="7" fill="#7B61FF"/><text x="280.0" y="532" text-anchor="middle" font-size="15" font-weight="700" fill="#FFFFFF">磁场 2</text><rect x="334" y="501" width="100" height="50" rx="7" fill="#2A9D8F"/><text x="384.0" y="532" text-anchor="middle" font-size="15" font-weight="700" fill="#FFFFFF">能源 2</text><text x="895" y="519" font-size="18" font-weight="700" fill="#0F172A">两条腿走路：软磁外场/AI磁谱 + 绿色循环/储能大叙事</text><text x="895" y="551" font-size="15.5" fill="#475569">代表：脏废料再生球铁+AI(SA)、Sn铁粉床储能(MT)、1.94 T 旋转磁场软磁(NC)</text><rect x="64" y="607" width="1472" height="114" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.2"/><text x="92" y="657" font-size="22" font-weight="800" fill="#0F172A">钛合金</text><text x="92" y="687" font-size="17" font-weight="700" fill="#2563EB">共 3 篇 (12%)</text><rect x="230" y="637" width="100" height="50" rx="7" fill="#1D4E89"/><text x="280.0" y="668" text-anchor="middle" font-size="15" font-weight="700" fill="#FFFFFF">破界 2</text><rect x="334" y="637" width="48" height="50" rx="7" fill="#2A9D8F"/><text x="358.0" y="668" text-anchor="middle" font-size="15" font-weight="700" fill="#FFFFFF">1</text><text x="895" y="655" font-size="18" font-weight="700" fill="#0F172A">体量最小但纯结构破界比例最高（2/3 为硬核破界）</text><text x="895" y="687" font-size="15.5" fill="#475569">代表：Ti64-0.39O 氧分配增塑(NC)、双尺度层片 TiAl(MT)、多孔钛蒸发(AFM)</text>

  <text x="64" y="802" font-size="15" fill="#94A3B8">来源：本地研究观察库 observatory.sqlite3（2026-10-12 至 2026-11-22），缩写：NM=Nat. Mater., SA=Sci. Adv., NC=Nat. Commun., MT=Mater. Today</text>
</svg>