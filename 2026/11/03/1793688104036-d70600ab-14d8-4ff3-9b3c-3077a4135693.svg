<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 1190" width="750" height="1190" role="img" aria-labelledby="fa-softmax-title fa-softmax-desc">
<title id="fa-softmax-title">在线 Softmax：先换统一刻度，再合并两块</title>
<desc id="fa-softmax-desc">一个 query 的注意力分数为 0、0、ln2、ln2，对应标量 V 为 10、20、30、40。第一块最大值 m=0，分母 l=2，加权和 u=30；第二块使最大值变为 ln2，将旧 l 和 u 同时乘以二分之一，得到 1 和 15。第二块新贡献为 2 和 70，总计 l=3，u=85，最终输出为 85/3，约 28.33。该结果与一次计算整行 softmax 相同；实际 V 是向量，逐维累计。</desc>
<defs><marker id="fa-softmax-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#178F89" stroke-width="1.8"/></marker></defs>
<g font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif"><rect x="0" y="0" width="750" height="1190" rx="0" fill="#F7F6F1" stroke="none" stroke-width="2" /><text x="36" y="64" font-size="39" fill="#183049" font-weight="700" text-anchor="start" >没看完整行，怎样算对 Softmax？</text><text x="36" y="115" font-size="32" fill="#627383" font-weight="500" text-anchor="start" >关键：统一刻度，再把两块的账合起来</text><rect x="36" y="152" width="323" height="180" rx="17" fill="#FFFFFF" stroke="#CCD7D9" stroke-width="2" /><text x="59" y="197" font-size="33" fill="#178F89" font-weight="700" text-anchor="start" >第一块</text><text x="59" y="250" font-size="31" fill="#183049" font-weight="600" text-anchor="start" >分数：0，0</text><text x="59" y="302" font-size="33" fill="#183049" font-weight="600" text-anchor="start" >V：10，20</text><rect x="391" y="152" width="323" height="180" rx="17" fill="#FFFFFF" stroke="#CCD7D9" stroke-width="2" /><text x="414" y="197" font-size="33" fill="#178F89" font-weight="700" text-anchor="start" >第二块</text><text x="414" y="250" font-size="31" fill="#183049" font-weight="600" text-anchor="start" >分数：ln 2，ln 2</text><text x="414" y="302" font-size="33" fill="#183049" font-weight="600" text-anchor="start" >V：30，40</text><g opacity="0"><animate attributeName="opacity" values="1;0;0;0;1" keyTimes="0;0.25;0.5;0.75;1" calcMode="discrete" dur="16s" begin="0s" repeatCount="indefinite"/><rect x="36" y="152" width="323" height="180" rx="17" fill="none" stroke="#178F89" stroke-width="4" /></g><g opacity="0"><animate attributeName="opacity" values="0;1;0;0;0" keyTimes="0;0.25;0.5;0.75;1" calcMode="discrete" dur="16s" begin="0s" repeatCount="indefinite"/><rect x="391" y="152" width="323" height="180" rx="17" fill="none" stroke="#178F89" stroke-width="4" /></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0;0.25;0.5;0.75;1" calcMode="discrete" dur="16s" begin="0s" repeatCount="indefinite"/><rect x="391" y="152" width="323" height="180" rx="17" fill="none" stroke="#178F89" stroke-width="4" /></g><rect x="36" y="362" width="678" height="664" rx="22" fill="#FFFFFF" stroke="#CCD7D9" stroke-width="2" /><g opacity="0"><animate attributeName="opacity" values="1;0;0;0;1" keyTimes="0;0.25;0.5;0.75;1" calcMode="discrete" dur="16s" begin="0s" repeatCount="indefinite"/><text x="65" y="421" font-size="38" fill="#183049" font-weight="700" text-anchor="start" >① 先收第一块</text><text x="65" y="483" font-size="34" fill="#183049" font-weight="500" text-anchor="start" >当前最大分数：m = 0</text><text x="65" y="546" font-size="32" fill="#627383" font-weight="500" text-anchor="start" >权重 e^(分数 − m)：1，1</text><rect x="65" y="588" width="620" height="119" rx="16" fill="#E8F4EF" stroke="none" stroke-width="2" /><text x="89" y="635" font-size="31" fill="#178F89" font-weight="600" text-anchor="start" >分母 l：权重之和</text><text x="89" y="685" font-size="39" fill="#178F89" font-weight="700" text-anchor="start" >1 + 1 = 2</text><rect x="65" y="731" width="620" height="119" rx="16" fill="#E8F4EF" stroke="none" stroke-width="2" /><text x="89" y="778" font-size="30" fill="#178F89" font-weight="600" text-anchor="start" >加权和 u：权重 × V，再相加</text><text x="89" y="827" font-size="36" fill="#178F89" font-weight="700" text-anchor="start" >1 × 10 + 1 × 20 = 30</text><text x="65" y="916" font-size="34" fill="#183049" font-weight="600" text-anchor="start" >此时不急着相除。</text><text x="65" y="973" font-size="31" fill="#627383" font-weight="500" text-anchor="start" >后面还有块，要继续更新这本账。</text></g><g opacity="0"><animate attributeName="opacity" values="0;1;0;0;0" keyTimes="0;0.25;0.5;0.75;1" calcMode="discrete" dur="16s" begin="0s" repeatCount="indefinite"/><text x="65" y="421" font-size="36" fill="#183049" font-weight="700" text-anchor="start" >② 最大分数变了，先换刻度</text><text x="65" y="483" font-size="34" fill="#183049" font-weight="500" text-anchor="start" >新的最大分数：m = ln 2</text><text x="65" y="546" font-size="30" fill="#627383" font-weight="500" text-anchor="start" >旧权重统一 × e^(0 − ln 2) = 1/2</text><rect x="65" y="588" width="620" height="119" rx="16" fill="#FFF0DF" stroke="none" stroke-width="2" /><text x="89" y="635" font-size="32" fill="#D87D43" font-weight="600" text-anchor="start" >旧分母 l，也乘 1/2</text><text x="89" y="685" font-size="40" fill="#D87D43" font-weight="700" text-anchor="start" >2 × 1/2 = 1</text><rect x="65" y="731" width="620" height="119" rx="16" fill="#FFF0DF" stroke="none" stroke-width="2" /><text x="89" y="778" font-size="32" fill="#D87D43" font-weight="600" text-anchor="start" >旧加权和 u，同样乘 1/2</text><text x="89" y="827" font-size="40" fill="#D87D43" font-weight="700" text-anchor="start" >30 × 1/2 = 15</text><text x="65" y="916" font-size="34" fill="#183049" font-weight="600" text-anchor="start" >分子、分母一起缩放。</text><text x="65" y="973" font-size="30" fill="#627383" font-weight="500" text-anchor="start" >换了计算刻度，旧块的相对比例没变。</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0;0.25;0.5;0.75;1" calcMode="discrete" dur="16s" begin="0s" repeatCount="indefinite"/><text x="65" y="421" font-size="38" fill="#183049" font-weight="700" text-anchor="start" >③ 加上第二块</text><text x="65" y="483" font-size="31" fill="#183049" font-weight="500" text-anchor="start" >新块分数都是 ln 2，权重仍是 1</text><text x="65" y="546" font-size="31" fill="#627383" font-weight="500" text-anchor="start" >在同一个最大值 m = ln 2 下合并</text><rect x="65" y="588" width="620" height="119" rx="16" fill="#E8F4EF" stroke="none" stroke-width="2" /><text x="89" y="635" font-size="31" fill="#178F89" font-weight="600" text-anchor="start" >分母 l：旧账 + 新块</text><text x="89" y="685" font-size="39" fill="#178F89" font-weight="700" text-anchor="start" >1 + (1 + 1) = 3</text><rect x="65" y="731" width="620" height="119" rx="16" fill="#E8F4EF" stroke="none" stroke-width="2" /><text x="89" y="778" font-size="31" fill="#178F89" font-weight="600" text-anchor="start" >加权和 u：旧账 + 新块</text><text x="89" y="827" font-size="37" fill="#178F89" font-weight="700" text-anchor="start" >15 + (30 + 40) = 85</text><text x="65" y="916" font-size="34" fill="#183049" font-weight="600" text-anchor="start" >局部分数可以释放。</text><text x="65" y="973" font-size="29" fill="#627383" font-weight="500" text-anchor="start" >留下 m、l、u，下一块仍按同样方式合并。</text></g><g opacity="1"><animate attributeName="opacity" values="0;0;0;1;0" keyTimes="0;0.25;0.5;0.75;1" calcMode="discrete" dur="16s" begin="0s" repeatCount="indefinite"/><text x="65" y="421" font-size="37" fill="#183049" font-weight="700" text-anchor="start" >④ 扫完整行，最后才相除</text><text x="65" y="483" font-size="30" fill="#183049" font-weight="500" text-anchor="start" >统一刻度下的权重：1/2，1/2，1，1</text><text x="65" y="545" font-size="34" fill="#627383" font-weight="500" text-anchor="start" >最大分数 m = ln 2</text><rect x="65" y="585" width="300" height="128" rx="16" fill="#E8F4EF" stroke="none" stroke-width="2" /><text x="215" y="634" font-size="32" fill="#178F89" font-weight="600" text-anchor="middle" >分母 l</text><text x="215" y="690" font-size="46" fill="#178F89" font-weight="700" text-anchor="middle" >3</text><rect x="385" y="585" width="300" height="128" rx="16" fill="#E8F4EF" stroke="none" stroke-width="2" /><text x="535" y="634" font-size="32" fill="#178F89" font-weight="600" text-anchor="middle" >加权和 u</text><text x="535" y="690" font-size="46" fill="#178F89" font-weight="700" text-anchor="middle" >85</text><text x="375" y="781" font-size="36" fill="#183049" font-weight="600" text-anchor="middle" >输出 = 加权和 ÷ 分母</text><text x="375" y="850" font-size="49" fill="#178F89" font-weight="700" text-anchor="middle" >85 ÷ 3 ≈ 28.33</text><text x="375" y="920" font-size="33" fill="#183049" font-weight="600" text-anchor="middle" >与整行一起做 Softmax 一致</text><text x="375" y="979" font-size="30" fill="#627383" font-weight="500" text-anchor="middle" >本例只需传递三项统计，不留完整权重。</text></g><rect x="36" y="1051" width="156" height="61" rx="12" fill="#EBEFEE" stroke="none" stroke-width="2" /><text x="114" y="1093" font-size="32" fill="#627383" font-weight="600" text-anchor="middle" >收块 1</text><g opacity="0"><animate attributeName="opacity" values="1;0;0;0;1" keyTimes="0;0.25;0.5;0.75;1" calcMode="discrete" dur="16s" begin="0s" repeatCount="indefinite"/><rect x="36" y="1051" width="156" height="61" rx="12" fill="#178F89" stroke="none" stroke-width="2" /><text x="114" y="1093" font-size="32" fill="#FFFFFF" font-weight="700" text-anchor="middle" >收块 1</text></g><rect x="210" y="1051" width="156" height="61" rx="12" fill="#EBEFEE" stroke="none" stroke-width="2" /><text x="288" y="1093" font-size="32" fill="#627383" font-weight="600" text-anchor="middle" >换刻度</text><g opacity="0"><animate attributeName="opacity" values="0;1;0;0;0" keyTimes="0;0.25;0.5;0.75;1" calcMode="discrete" dur="16s" begin="0s" repeatCount="indefinite"/><rect x="210" y="1051" width="156" height="61" rx="12" fill="#178F89" stroke="none" stroke-width="2" /><text x="288" y="1093" font-size="32" fill="#FFFFFF" font-weight="700" text-anchor="middle" >换刻度</text></g><rect x="384" y="1051" width="156" height="61" rx="12" fill="#EBEFEE" stroke="none" stroke-width="2" /><text x="462" y="1093" font-size="32" fill="#627383" font-weight="600" text-anchor="middle" >加块 2</text><g opacity="0"><animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0;0.25;0.5;0.75;1" calcMode="discrete" dur="16s" begin="0s" repeatCount="indefinite"/><rect x="384" y="1051" width="156" height="61" rx="12" fill="#178F89" stroke="none" stroke-width="2" /><text x="462" y="1093" font-size="32" fill="#FFFFFF" font-weight="700" text-anchor="middle" >加块 2</text></g><rect x="558" y="1051" width="156" height="61" rx="12" fill="#EBEFEE" stroke="none" stroke-width="2" /><text x="636" y="1093" font-size="32" fill="#627383" font-weight="600" text-anchor="middle" >做除法</text><g opacity="1"><animate attributeName="opacity" values="0;0;0;1;0" keyTimes="0;0.25;0.5;0.75;1" calcMode="discrete" dur="16s" begin="0s" repeatCount="indefinite"/><rect x="558" y="1051" width="156" height="61" rx="12" fill="#178F89" stroke="none" stroke-width="2" /><text x="636" y="1093" font-size="32" fill="#FFFFFF" font-weight="700" text-anchor="middle" >做除法</text></g><text x="375" y="1153" font-size="27" fill="#627383" font-weight="500" text-anchor="middle" >过程示意 · 此处 V 为标量，实际按向量逐维累积</text></g></svg>